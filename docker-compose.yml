services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped

    ports:
      - "5678:5678"

    networks:
      - default
      - dev-network

    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=development
      - GENERIC_TIMEZONE=Asia/Jakarta
      - TZ=Asia/Jakarta

    volumes:
      - ./data:/home/node/.n8n

networks:
  dev-network:
    external: true